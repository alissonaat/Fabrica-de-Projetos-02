<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado - Nana Borik</title>
</head>

<body>

    <!-- Cabeçalho do site -->
    <header>

                <div class="topo">
            <div class="logo">
                <span>NANA</span>
                <span>BOROK</span>
            </div>
            <div class="pesquisa">
                <span>🔍</span>
                <input 
                    type="text" 
                    placeholder="Pesquise produtos e muito mais..."
                >
            </div>
            <div class="acoes">
                <button>🔔</button>
                <button>🛒</button>
                <button class="perfil">👤</button>
            </div>

        </div>

    </header>

    <main>

        <section class="cartao-confirmacao">

            <h1>Pedido Confirmado!</h1>

            <div class="icone-confirmacao" aria-label="Pedido confirmado">
                <span>&#10004;</span>
            </div>

            <p>
                Seu produto chegará em breve!
            </p>

            <button
                type="button"
                onclick="window.location.href='ideia-produto.html'"
            >
                &#128161; Envie uma Ideia!
            </button>

            <p>
                Tem alguma sugestão? Conte para gente!<br>
                Sua ideia pode virar um produto em nossa Loja!
            </p>

        </section>

    </main>

</body>

</html>
