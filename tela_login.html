<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login - Onvit-e</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
       <h1><span style="color: #003366;">on</span>vit-e</h1>
    </header>
    <manin>
        <section>
            <h2>Bem-Vindo ao onvit-e</h2>
            <p>Acesse sua conta para continuar</p>

            <form action="#" method="post">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <input
                    type="checkbox"
                    id="lembrar"
                    name="lembrar"
                >

                <label for="lembrar">Lembrar de mim</label>

                <a ref="#">Esqueci minha senha</a>
                <br><br>

                <button type="submit">ENTRAR</button>
            </form>
        </section>
    </manin>
</body>
<footer class="rodape">
    <div class="rodape-inferior">
        <p>
           © 2026 onvi-e. Todos os direitos reservados.
        </p>
    </div>
</footer>
</html>
</html>
